  testo: "Il corso AI Data Specialist introduce all’analisi dei dati e alle tecniche di intelligenza artificiale. Forma Tecnici Superiori Data Manager con specializzazione nello sviluppo di applicazioni per Big Data e industria 4.0: statistica, informatica e matematica per modelli di machine learning e AI che automatizzano decisioni e ottimizzano processi."
  diploma: "Diploma di specializzazione per le tecnologie applicate — Tecnico superiore Data Manager, sviluppo di applicazioni per Big Data con specializzazione per l’industria 4.0, AI Data Specialist."
