- id: full-stack
  its: "ITS Accademia Digitale"
  gruppo: digitale
  corso: "Full-Stack Developer"
  tagline: "Impara a sviluppare ciò che tutti utilizzano."
  url: "https://www.accademiadigitaleliguria.it/corso/full-stack-developer-16/"
  iscrizione_url: "https://www.accademiadigitaleliguria.it/corso/full-stack-developer-16/#form"
  iscrizione_label: "Iscriviti al corso"
  scheda_iscrizione_url: "https://www.accademiadigitaleliguria.it/wp-content/uploads/2026/07/16.1_-Allegato-10-Scheda-di-iscrizione_Full-Stack-Developer_compilabile.pdf"
  programma_url: "https://www.accademiadigitaleliguria.it/wp-content/uploads/2026/05/programma-corso-Full-Stack-16.1.pdf"
  testo: "Il corso Full-Stack Developer dell’ITS-ICT Accademia Digitale Liguria ti porta nel cuore dello sviluppo software, dal front-end al back-end. Imparerai a progettare e creare applicazioni reali usando linguaggi, framework e metodologie richieste dalle aziende. Forma Tecnici Superiori sviluppatori di software con specializzazione per l’industria 4.0, in grado di operare sia lato front-end che back-end, con metodologie DevOps e Agile e strumenti di AI per lo sviluppo."
  diploma: "Diploma di specializzazione per le tecnologie applicate — Tecnico superiore sviluppatore di software con specializzazione per l’industria 4.0, Full-Stack Developer. 5° livello EQF, valido per i pubblici concorsi."
  fatti:
    - { label: "Costo", valore: "Gratuito" }
    - { label: "Durata", valore: "Biennale, 1.000 ore" }
    - { label: "Stage", valore: "800 ore" }
    - { label: "Diploma", valore: "5° livello EQF" }
    - { label: "Iscrizioni", valore: "Aperte fino al 23 ottobre 2026" }
    - { label: "Open Day", valore: "15 settembre 2026" }
  competenze:
    - "Sviluppo front-end e back-end: linguaggi Object Oriented, scripting e SQL; framework React, Angular, .NET/C#, Java; Web Services e database."
    - "DevOps e ciclo di vita del software: Agile, sicurezza dei dati, mobile e cloud, revisione e controllo del codice."
    - "AI per lo sviluppo software: strumenti di intelligenza artificiale per accelerare lo sviluppo, individuare bug e ottimizzare il codice."
  destinatari: "Per chi vuole avviare una carriera nello sviluppo software, anche da zero. Serve un diploma di scuola secondaria superiore (o titolo equivalente); non è richiesta esperienza professionale."

- id: ai-data
  its: "ITS Accademia Digitale"
  gruppo: digitale
  corso: "AI Data Specialist"
