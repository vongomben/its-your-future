<div class="iyf-table-wrap iyf-data-panel">
  <table class="iyf-corsi-table">
    <thead>
      <tr>
        <th>ITS</th>
        <th>Corso</th>
      </tr>
    </thead>
    <tbody>
      {% for c in corsi %}
      <tr>
        <td>{{ c.its }}</td>
        <td>
          {% if c.url %}
          <a href="{{ c.url }}" target="_blank" rel="noopener">{{ c.corso }}</a>
          {% else %}
          {{ c.corso }}
          {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
