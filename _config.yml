title: "IT'S YOUR FUTURE"
description: "Percorsi ludico-didattici ITS: quiz, missioni, escape game rapidi e simulazioni tecniche."
lang: it

# Testi hero homepage — modificabili da qui
hero:
  kicker: "Percorsi didattico-orientativi ITS"
  title: "IT'S YOUR FUTURE"
  description: "Raccoglie corsi, materiali e percorsi ludico-didattici utilizzabili per orientamento, open day, installazioni interattive e attività brevi da 3–7 minuti."
  progetto:
    - "Il progetto IT'S YOUR FUTURE, realizzato nell'ambito del PNRR e finanziato dall'Unione europea – Next Generation EU, propone la sperimentazione di uno strumento innovativo per la programmazione e realizzazione di attività di Orientamento e diffusione delle opportunità formative degli ITS liguri aderenti alla presente iniziativa, in cui studenti e studentesse diventano protagonisti di una sfida immersiva tra enigmi, logica e creatività digitale."
    - "Un percorso di gamification collaborativo e asimmetrico in cui testare le principali conoscenze e abilità delle Aree tecnologiche rappresentate dal partenariato, mediante enigmi da risolvere all'interno di uno showcase fisico e digitale, orientando i giovani nella scelta del percorso post diploma più idoneo alle loro potenzialità, ambizioni e aspettative."
    - "Attraverso un percorso strutturato, i partecipanti vengono coinvolti in prove da risolvere con strumenti digitali e indizi interattivi che richiamano i principali ambiti dei profili in esito ai percorsi formativi degli ITS coinvolti: dall'ambito ICT (ITS ICT ACCADEMIA DIGITALE LIGURIA - GENOVA) e del Turismo (ITS TURISMO LIGURIA - ACADEMY OF TOURISM, CULTURE AND HOSPITALITY), alle professionalità legate ai settori dei Servizi alle imprese e della Meccatronica (ITS ACADEMY - LA SPEZIA)."

# Sezione "Come funziona" homepage — modificabile da qui
come_funziona:
  titolo: "Come funziona:"
  testo: 'ogni scheda presenta un''attività ludico-didattica collegata a un corso ITS. Clicca su <em>Scopri l''attività</em> per leggere scenario, prove e competenze.'

logo:
  src: "/img/IT-Y-Flogo.png"
  alt: "IT'S YOUR FUTURE"
  composizione_orizzontale_lunga: "/img/composizione_orizzontale_lunga.png"
# Dominio custom in root (its-your-future.it). Con baseurl vuoto,
# {{ '/assets/...' | relative_url }} diventa /assets/... e funziona
# sia in locale sia sul dominio.
baseurl: ""
url: "https://its-your-future.it"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

plugins: []

collections:
  progetti:
    output: true
    permalink: /progetti/:name/
    sort_by: order

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: progetti
    values:
      layout: progetto

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - its-your-future-jekyll-template3.md
  - vendor